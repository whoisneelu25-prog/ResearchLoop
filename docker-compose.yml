version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: researchloop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: researchloop
      POSTGRES_USER: researchloop
      POSTGRES_PASSWORD: researchloop_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U researchloop -d researchloop" ]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.20-community
    container_name: researchloop-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/researchloop_password
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:7474" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: researchloop-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://researchloop:researchloop_password@postgres:5432/researchloop
      JWT_SECRET: ${JWT_SECRET:-researchloop-secret-key-medical-intelligence-2026}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: researchloop_password
      PUBMED_API_KEY: ${PUBMED_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: researchloop-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
  neo4j_data:
